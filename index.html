<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFA GUNKA</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0b] text-white">
<header class="p-6 flex justify-between border-b border-zinc-800"><h1 class="text-2xl font-black">SFA <span class="text-yellow-400">GUNKA</span></h1></header>
<div class="p-6"><div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div></div>

<div id="playerModal" class="fixed inset-0 bg-black/95 hidden z-[999] flex items-center justify-center p-4">
<div class="bg-zinc-900 w-full max-w-2xl rounded-2xl overflow-hidden">
<div class="p-3 flex justify-between bg-black"><span id="playerTitle"></span><button onclick="closePlayer()" class="bg-white text-black px-3 rounded-full">X</button></div>
<div id="adBox" class="aspect-video bg-black flex items-center justify-center"></div>
<video id="mainVideo" class="w-full aspect-video hidden" controls playsinline></video>
</div></div>

<script>
const TOKEN="8895544903:AAHbD3V0yU-4vdXl8Ih_EadrmnZAgJWlHtQ";
const CHANNEL_ID="-1002897263402";

async function getRealVastUrl(){
  let ip="8.8.8.8";
  try{let r=await fetch('https://api.ipify.org?format=json');let j=await r.json();ip=j.ip;}catch(e){}
  let ua=encodeURIComponent(navigator.userAgent);
  return `https://16793.rtb.adp3.net/pre-roll-rp?pubid=1013423&siteid=410055&ip=${ip}&ua=${ua}`;
}

async function loadVideos(){
  let res=await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?limit=100`);
  let data=await res.json();
  let posts=data.result.map(r=>r.channel_post||r.message).filter(Boolean).filter(p=>String(p.chat.id)===CHANNEL_ID);
  if(posts.length===0) posts=data.result.map(r=>r.channel_post||r.message).filter(Boolean).filter(p=>p.video);
  document.getElementById('videoGrid').innerHTML=posts.reverse().map(p=>{
    if(!p.video?.file_id) return '';
    let t=(p.caption||"Video by Aarush").replace(/'/g,"");
    return `<div class="bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800"><div class="aspect-video bg-zinc-800 flex items-center justify-center">▶️</div><div class="p-4"><div class="font-bold truncate">${t}</div><button onclick="play('${p.video.file_id}','${t}')" class="mt-3 w-full bg-yellow-400 text-black py-2.5 rounded-xl font-bold">WATCH</button></div></div>`;
  }).join('');
}

async function play(file_id,title){
  document.getElementById('playerModal').classList.remove('hidden');
  document.getElementById('playerTitle').innerText=title;
  let adBox=document.getElementById('adBox');
  adBox.classList.remove('hidden');
  document.getElementById('mainVideo').classList.add('hidden');
  adBox.innerHTML=`<p class="text-yellow-400 animate-pulse">Loading Ad... IP: getting</p>`;

  let vastUrl=await getRealVastUrl();
  console.log("VAST URL:",vastUrl);
  adBox.innerHTML=`<div class="p-6 text-center"><p class="text-zinc-400 text-sm">RichAds VAST Tag Loaded</p><p class="text-xs break-all mt-2 text-zinc-600">${vastUrl}</p><button onclick="playMain('${file_id}')" class="mt-4 bg-yellow-400 text-black px-6 py-2 rounded-full font-bold">Skip Ad & Play Video</button><p class="text-xs mt-2 text-zinc-500">Note: RichAds dashboard me Finish dabaoge tabhi real video ad ayega</p></div>`;

  // Auto play after 5 sec
  setTimeout(()=>playMain(file_id),5000);
}

async function playMain(file_id){
  let adBox=document.getElementById('adBox');
  adBox.classList.add('hidden');
  let res=await fetch(`https://api.telegram.org/bot${TOKEN}/getFile?file_id=${file_id}`);
  let data=await res.json();
  let videoUrl=`https://api.telegram.org/file/bot${TOKEN}/${data.result.file_path}`;
  let v=document.getElementById('mainVideo');
  v.classList.remove('hidden');
  v.src=videoUrl; v.play();
}

function closePlayer(){document.getElementById('playerModal').classList.add('hidden');document.getElementById('mainVideo').pause();}
loadVideos();
</script></body></html>
