<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFA 100 Levels</title>
<link rel="stylesheet" href="style.css">
<script src="https://sdk.adsbitvex.com/functions/v1/ad-script?appid=000508"></script>
</head>
<body>

<!-- SCREEN 1: HOME -->
<div id="home" class="screen active">
  <h1>🧩 SFA PUZZLE</h1>
  <p>100 Levels of Brain Test</p>
  <button class="playBtn" onclick="openLevelGrid()">▶ PLAY</button>
</div>

<!-- SCREEN 2: 100 LEVEL GRID -->
<div id="levelScreen" class="screen">
  <div class="topBar">
    <button onclick="goHome()">← Home</button>
    <h3>SELECT LEVEL</h3>
  </div>
  <div id="levelGrid"></div>
</div>

<!-- SCREEN 3: GAME -->
<div id="gameScreen" class="screen">
  <div class="topBar">
    <button onclick="openLevelGrid()">← Levels</button>
    <div>LEVEL <span id="currLevel">1</span> | <span id="score">0</span>/300</div>
  </div>
  <div id="board"></div>
  <div id="progress"><div id="progressBar"></div></div>
  <p class="hint">Tap tiles - Make 300 Score</p>
</div>

<!-- POPUP FOR 5,10,15... -->
<div id="popup">
  <div class="popupBox">
    <h2>🔒 Level <span id="lockLevel">5</span> Locked</h2>
    <p>Ad dekho aur unlock karo</p>
    <button class="btn-reward" onclick="watchRewarded()">📺 WATCH AD & UNLOCK</button>
    <button class="btn-close" onclick="closePopup()">CLOSE</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
