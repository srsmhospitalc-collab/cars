<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFA GUNKA - Panther Gamers</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0b] text-white min-h-screen">
<header class="p-6 flex justify-between items-center border-b border-zinc-800">
  <h1 class="text-2xl font-black">SFA <span class="text-yellow-400">GUNKA</span></h1>
  <a href="aarush.html" class="text-xs bg-zinc-800 px-4 py-2 rounded-full">AARUSH PANEL</a>
</header>

<div class="p-6">
  <h2 class="text-xl font-bold">Latest Videos</h2>
  <p class="text-xs text-zinc-500">Powered by Panther Gamers Telegram</p>
  <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mt-6"></div>
</div>

<div id="playerModal" class="fixed inset-0 bg-black/90 hidden z-[999] flex items-center justify-center p-4">
  <div class="bg-zinc-900 w-full max-w-3xl rounded-[24px] overflow-hidden border border-zinc-800">
    <div class="p-4 flex justify-between items-center bg-black">
      <h3 id="playerTitle" class="font-bold text-sm">Playing...</h3>
      <button onclick="closePlayer()" class="bg-white text-black px-4 py-1 rounded-full text-sm font-bold">X</button>
    </div>
    <div id="preRollAd" class="aspect-video bg-black flex flex-col items-center justify-center"></div>
    <video id="mainVideo" class="w-full aspect-video hidden bg-black" controls playsinline></video>
  </div>
</div>

<script>
const TOKEN = "8895544903:AAHbD3V0yU-4vdXl8Ih_EadrmnZAgJWlHtQ";
const CHANNEL_ID = "-1002897263402";

async function loadVideos(){
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = "Loading...";
  let res = await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?limit=100`);
  let data = await res.json();
  let allPosts = data.result.map(r => r.channel_post || r.message).filter(Boolean);
  let channelPosts = allPosts.filter(p => String(p.chat.id) === String(CHANNEL_ID));
  if(channelPosts.length===0) channelPosts = allPosts.filter(p=>p.video);

  grid.innerHTML = channelPosts.reverse().map(post=>{
    if(!post.video?.file_id) return '';
    let title = (post.caption||"Video by Aarush").replace(/'/g,"");
    return `<div class="bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800">
      <div class="aspect-video bg-zinc-800 flex items-center justify-center">▶️</div>
      <div class="p-4"><div class="font-bold text-sm truncate">${title}</div>
      <button onclick="play('${post.video.file_id}','${title}')" class="mt-3 w-full bg-yellow-400 text-black py-2.5 rounded-xl font-bold">WATCH</button></div></div>`;
  }).join('');
}

async function play(file_id, title){
  document.getElementById('playerModal').classList.remove('hidden');
  document.getElementById('playerTitle').innerText = title;
  let count=5;
  let interval=setInterval(()=>{
    document.getElementById('preRollAd').innerHTML=`<p class="text-yellow-400 font-bold animate-pulse">Ad - Skip in ${count}s</p>`;
    if(count--<=0){clearInterval(interval);playActualVideo(file_id);}
  },1000);
}

async function playActualVideo(file_id){
  let res = await fetch(`https://api.telegram.org/bot${TOKEN}/getFile?file_id=${file_id}`);
  let data = await res.json();
  let videoUrl = `https://api.telegram.org/file/bot${TOKEN}/${data.result.file_path}`;
  let v=document.getElementById('mainVideo');
  document.getElementById('preRollAd').classList.add('hidden');
  v.classList.remove('hidden');
  v.src=videoUrl; v.play();
}
function closePlayer(){document.getElementById('playerModal').classList.add('hidden');document.getElementById('mainVideo').pause();}
loadVideos();
</script>
</body>
</html>
