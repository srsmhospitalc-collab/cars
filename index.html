<div id="videoGrid" class="grid grid-cols-3 gap-4 p-6"></div>
<script>
const TOKEN = "8895544903:AAHbD3V0yU-4vdXl8Ih_EadrmnZAgJWlHtQ";
const CHANNEL_ID = "-1002897263402";

async function loadVideos(){
  const grid = document.getElementById('videoGrid');
  try {
    let res = await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?limit=100`);
    let data = await res.json();
    
    let allPosts = data.result.map(r => r.channel_post || r.message).filter(Boolean);
    let channelPosts = allPosts.filter(p => p.chat.id == CHANNEL_ID);

    if(channelPosts.length === 0){
      grid.innerHTML = `<p class="text-zinc-500 col-span-3">No videos found. Ek naya video Aarush panel se upload karo.</p>`;
      return;
    }

    grid.innerHTML = channelPosts.reverse().map(post => {
      // SAFE CHECK - yahi error fix hai
      let hasVideo = post.video && post.video.file_id;
      let hasPhoto = post.photo;
      let title = post.caption || post.text || "Video by Aarush";
      
      // file_id nahi hai to skip nahi karega, safe dikhayega
      return `
        <div class="bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800">
          <div class="aspect-video bg-zinc-800 flex items-center justify-center">
            ${hasVideo ? '▶️ VIDEO' : hasPhoto ? '🖼️ PHOTO' : '📄 POST'}
          </div>
          <div class="p-3">
            <div class="text-sm font-bold truncate">${title}</div>
            <div class="text-xs text-zinc-500">${hasVideo ? 'Click to play' : 'No file_id - ye text post hai'}</div>
            ${hasVideo ? `<button onclick="play('${post.video.file_id}')" class="mt-2 w-full bg-yellow-400 text-black py-2 rounded-lg text-xs font-bold">PLAY</button>` : ''}
          </div>
        </div>
      `;
    }).join('');

  } catch(e){
    document.getElementById('videoGrid').innerHTML = `Error: ${e.message}`;
  }
}

function play(file_id){
  // yaha tera pre-roll ad ayega
  alert("Playing file_id: " + file_id);
  // getFile API se direct link: https://api.telegram.org/bot${TOKEN}/getFile?file_id=${file_id}
}

loadVideos();
</script>
