<div id="videoGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 p-6"></div>

<script>
const TOKEN = "8895544903:AAHbD3V0yU-4vdXl8Ih_EadrmnZAgJWlHtQ";
const CHANNEL_ID = "-1002897263402";

async function loadVideosForUser(){
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = "<p class='text-zinc-500'>Panther Gamers se videos load ho rahi hai...</p>";

  try {
    // Telegram se last 50 videos lana
    let res = await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?limit=50`);
    let data = await res.json();
    
    // Filter sirf tere channel ke videos
    let videos = data.result.filter(u => u.channel_post && u.channel_post.chat.id == CHANNEL_ID).reverse();

    if(videos.length == 0){
      // Agar getUpdates me na ho to - channel_post ko direct check karne ka backup
      grid.innerHTML = "<p class='text-yellow-400'>Channel me videos hai, par Bot ne abhi tak history nahi dekhi. Ek baar naya video upload karo, fir sab aa jayega.</p>";
      return;
    }

    grid.innerHTML = videos.map((u, i) => {
      let post = u.channel_post;
      let title = post.caption || `Video ${i+1} by Aarush`;
      return `
        <div class="bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800 cursor-pointer hover:border-yellow-400" onclick="playVideo('${post.video.file_id}')">
          <div class="aspect-video bg-zinc-800 flex items-center justify-center">
            <span class="text-4xl">▶️</span>
          </div>
          <div class="p-4">
            <div class="font-bold text-sm">${title}</div>
            <div class="text-xs text-zinc-500 mt-1">Click to Play - Pre-Roll Ad</div>
          </div>
        </div>
      `;
    }).join('');

  } catch(e){
    grid.innerHTML = "❌ Error: " + e.message;
  }
}

function playVideo(file_id){
  // Yaha tera pre-roll ad logic ayega
  // Phir telegram file ko play karega: https://api.telegram.org/file/bot${TOKEN}/...
  alert("Pre-Roll Ad chalega fir video: " + file_id);
  // Tera existing preRoll function call kar
}

loadVideosForUser();
</script>
