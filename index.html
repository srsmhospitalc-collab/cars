<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFA GUNKA - Premium Videos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Space Grotesk'; background:#0a0a0b;}</style>
</head>
<body class="text-white">
<header class="p-6 flex justify-between items-center border-b border-zinc-800">
<div class="text-2xl font-bold tracking-widest">SFA <span class="text-yellow-400">GUNKA</span></div>
<div class="text-xs text-zinc-500">PRE-ROLL EDITION</div>
</header>

<div id="videoGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 p-6"></div>

<!-- PRE-ROLL MODAL -->
<div id="preRoll" class="fixed inset-0 bg-black/95 z-50 hidden flex-col items-center justify-center p-6">
  <div class="w-full max-w-2xl">
    <div class="flex justify-between mb-3"><span class="text-yellow-400 text-sm">PETROL AD - SFA GUNKA</span><span id="timer" class="text-sm">5s</span></div>
    <div class="aspect-video bg-zinc-900 rounded-2xl flex items-center justify-center border border-yellow-400/20">
      <video id="adVideo" class="w-full h-full rounded-2xl" src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
    </div>
    <button id="skipBtn" disabled class="w-full mt-4 bg-zinc-800 text-zinc-500 py-4 rounded-xl">Complete Ad to Unlock Video</button>
  </div>
</div>

<script>
// CONFIG
const uploader = localStorage.getItem('uploader') || 'Aarush'; // Aarush / Mishra
function playVideo(id, uploadedBy){
  // WATCH ADS COUNT
  let watch = JSON.parse(localStorage.getItem('sfa_watch')||'{}');
  watch[uploadedBy] = (watch[uploadedBy]||0)+1;
  localStorage.setItem('sfa_watch', JSON.stringify(watch));

  // SHOW PRE-ROLL
  document.getElementById('preRoll').classList.remove('hidden');
  document.getElementById('preRoll').classList.add('flex');
  let ad = document.getElementById('adVideo');
  ad.play();
  let t=5; let interval=setInterval(()=>{t--; document.getElementById('timer').innerText=t+'s'; if(t<=0){clearInterval(interval); document.getElementById('skipBtn').disabled=false; document.getElementById('skipBtn').className="w-full mt-4 bg-yellow-400 text-black py-4 rounded-xl font-bold"; document.getElementById('skipBtn').innerText="Continue to Video"; }},1000);

  document.getElementById('skipBtn').onclick=()=>{
    // COMPLETE ADS COUNT
    let comp = JSON.parse(localStorage.getItem('sfa_complete')||'{}');
    comp[uploadedBy] = (comp[uploadedBy]||0)+1;
    localStorage.setItem('sfa_complete', JSON.stringify(comp));
    document.getElementById('preRoll').classList.add('hidden');
    // PLAY MAIN VIDEO
    alert('Main Video '+id+' Playing Now');
  }
}
// Demo videos
document.getElementById('videoGrid').innerHTML = [1,2,3,4,5,6].map(i=>`
  <div onclick="playVideo(${i},'Aarush')" class="bg-zinc-900 rounded-2xl p-3 border border-zinc-800 hover:border-yellow-400/50 cursor-pointer">
    <div class="aspect-video bg-zinc-800 rounded-xl mb-3"></div>
    <div class="font-semibold">Video ${i} by Aarush</div>
    <div class="text-xs text-zinc-500">Click to Play - Pre-Roll Ad</div>
  </div>
`).join('');
</script>
</body>
</html>
