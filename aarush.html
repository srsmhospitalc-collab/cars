<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AARUSH - SFA GUNKA</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0b] text-white p-6">
<h1 class="text-2xl font-bold">SFA <span class="text-yellow-400">GUNKA</span> - AARUSH</h1>
<p class="text-xs text-zinc-500">Channel: Panther Gamers (-1002897263402)</p>

<div class="mt-6 bg-yellow-400 text-black p-6 rounded-[24px]">
  <p class="text-xs font-bold opacity-60">COMPLETE ADS</p>
  <p id="myCount" class="text-5xl font-bold">0</p>
</div>

<div class="mt-8 bg-zinc-900 p-6 rounded-[24px] border border-zinc-800 max-w-xl">
  <h3 class="font-bold mb-4">Upload Video (Telegram Auto-Post)</h3>
  <input type="file" id="fileInput" accept="video/*" class="w-full bg-black border border-zinc-800 rounded-xl p-3">
  <input id="titleInput" placeholder="Video Title" class="w-full mt-3 bg-black border border-zinc-800 rounded-xl px-4 py-3">
  <button onclick="upload()" id="uploadBtn" class="w-full mt-4 bg-yellow-400 text-black py-4 rounded-xl font-bold">UPLOAD TO PANTHER GAMERS</button>
  <p id="status" class="text-xs text-zinc-500 mt-3">Ready</p>
</div>

<script>
const TOKEN = "8895544903:AAHbD3V0yU-4vdXl8Ih_EadrmnZAgJWlHtQ";
const CHANNEL_ID = "-1002897263402";

async function upload(){
  const file = document.getElementById('fileInput').files[0];
  const title = document.getElementById('titleInput').value || "New Video by Aarush";
  if(!file) return alert('Video select kar bhai');

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  btn.innerText = "UPLOADING...";
  document.getElementById('status').innerText = "Panther Gamers pe bhej raha hu...";

  const formData = new FormData();
  formData.append('chat_id', CHANNEL_ID);
  formData.append('video', file);
  formData.append('caption', `🎬 ${title}\n\n👤 By Aarush\n🔥 SFA GUNKA\n\n#SFA #GUNKA`);
  formData.append('parse_mode', 'HTML');

  try {
    const res = await fetch(`https://api.telegram.org/bot${TOKEN}/sendVideo`, {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if(data.ok){
      document.getElementById('status').innerText = "✅ Ho gaya! Channel pe post ID: " + data.result.message_id;
      btn.innerText = "UPLOADED ✅";
      // Complete count badha
      let c = JSON.parse(localStorage.getItem('sfa_complete')||'{}');
      c['Aarush'] = (c['Aarush']||0)+1;
      localStorage.setItem('sfa_complete', JSON.stringify(c));
      document.getElementById('myCount').innerText = c['Aarush'];
    } else {
      document.getElementById('status').innerText = "❌ Error: " + data.description;
      btn.disabled = false;
      btn.innerText = "TRY AGAIN";
    }
  } catch(e){
    document.getElementById('status').innerText = "❌ Network error: Bot ko channel ka admin banaya kya?";
    btn.disabled = false;
  }
}

let c = JSON.parse(localStorage.getItem('sfa_complete')||'{}');
document.getElementById('myCount').innerText = c['Aarush']||0;
</script>
</body>
</html>
