<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width"><title>SFA GUNKA ADMIN</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0b] text-white p-8">
<h1 class="text-4xl font-bold mb-8">SFA <span class="text-yellow-400">GUNKA</span> <span class="text-sm text-zinc-500">ADMIN</span></h1>
<div class="grid grid-cols-2 gap-6">
  <div class="bg-zinc-900 p-8 rounded-[24px] border border-zinc-800"><p class="text-zinc-500 text-sm">WATCH ADS (Play Clicks)</p><p id="watchTotal" class="text-5xl font-bold mt-2">0</p></div>
  <div class="bg-yellow-400 p-8 rounded-[24px] text-black"><p class="text-sm opacity-70">COMPLETE ADS (Full View)</p><p id="compTotal" class="text-5xl font-bold mt-2">0</p></div>
</div>
<div id="list" class="mt-8 bg-zinc-900 rounded-[24px] p-6"></div>
<button onclick="localStorage.clear(); location.reload()" class="mt-6 bg-red-500/10 text-red-400 px-6 py-3 rounded-xl border border-red-500/20">RESET ALL COUNTS</button>
<script>
function load(){
  let w=JSON.parse(localStorage.getItem('sfa_watch')||'{}');
  let c=JSON.parse(localStorage.getItem('sfa_complete')||'{}');
  document.getElementById('watchTotal').innerText=Object.values(w).reduce((a,b)=>a+b,0);
  document.getElementById('compTotal').innerText=Object.values(c).reduce((a,b)=>a+b,0);
  document.getElementById('list').innerHTML=Object.keys({...w,...c}).map(k=>`<div class="flex justify-between py-3 border-b border-zinc-800"><span>${k}</span><span>Watch: ${w[k]||0} | Complete: ${c[k]||0}</span></div>`).join('');
} load();
</script>
</body></html>
